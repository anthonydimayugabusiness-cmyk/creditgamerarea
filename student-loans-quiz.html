    <link rel="stylesheet" href="/styles.css">
    <style>
        .quiz-page { padding: 40px 0; min-height: calc(100vh - 200px); }
        .quiz-container { max-width: 700px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .quiz-header { text-align: center; margin-bottom: 32px; }
        .quiz-header .category-tag { display: inline-block; background: #8b5cf6; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 600; margin-bottom: 16px; }
        .quiz-header h1 { font-size: 1.875rem; margin-bottom: 8px; }
        .progress-container { margin-bottom: 32px; }
        .progress-bar-bg { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #8b5cf6, #a78bfa); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
        .progress-text { font-size: 0.875rem; color: #64748b; margin-top: 8px; text-align: center; }
        .question-container h2 { font-size: 1.375rem; margin-bottom: 24px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option { background: white; border: 2px solid #e2e8f0; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; }
        .option:hover { border-color: #8b5cf6; background: #f8fafc; }
        .option.correct { border-color: #10b981; background: #d1fae5; }
        .option.incorrect { border-color: #ef4444; background: #fee2e2; }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .explanation { margin-top: 24px; padding: 20px; border-radius: 12px; }
        .explanation.correct { background: #d1fae5; border: 1px solid #10b981; }
        .explanation.incorrect { background: #fee2e2; border: 1px solid #ef4444; }
        .explanation h4 { margin-bottom: 8px; font-size: 1.125rem; }
        .explanation.correct h4 { color: #047857; }
        .explanation.incorrect h4 { color: #b91c1c; }
        .next-btn { margin-top: 16px; background: #8b5cf6; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .results-container { text-align: center; padding: 40px 20px; }
        .results-emoji { font-size: 4rem; margin-bottom: 16px; }
        .results-score { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #8b5cf6, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 16px 0; }
        .results-message { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        .results-subtitle { color: #64748b; margin-bottom: 32px; }
        .results-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background: #8b5cf6; color: white; }
        .btn-secondary { background: white; color: #8b5cf6; border: 2px solid #8b5cf6; }
        .start-screen { text-align: center; padding: 40px 20px; }
        .quiz-meta { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
        .quiz-meta span { display: flex; align-items: center; gap: 8px; color: #64748b; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">💳 Credit Gamer Area</a>
        </div>
    </nav>

    <section class="quiz-page">
        <div class="container">
            <div id="quiz-content" class="quiz-container">
                <div class="start-screen">
                    <span class="category-tag">Loans</span>
                    <h2>🎓 Student Loans Quiz</h2>
                    <p>Federal vs private, repayment plans, and forgiveness options</p>
                    <div class="quiz-meta">
                        <span>📝 10 Questions</span>
                        <span>⏱️ ~5 min</span>
                        <span>📊 Medium</span>
                    </div>
                    <button class="btn btn-primary" onclick="startQuiz()" style="font-size: 1.125rem; padding: 16px 32px;">Start Quiz</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const quizData = {
            title: "Student Loans",
            category: "Loans",
            description: "Federal vs private, repayment plans, and forgiveness options",
            questions: 10,
            difficulty: "Medium",
            time: "5 min",
            data: [
                { question: "Which type of student loan typically has lower interest rates?", options: ["Private loans", "Federal loans", "Both are the same", "It depends on your credit"], correct: 1, explanation: "Federal loans usually have lower fixed rates and more flexible repayment options than private loans." },
                { question: "What is the FAFSA?", options: ["A type of loan", "Free Application for Federal Student Aid", "A scholarship program", "A credit check"], correct: 1, explanation: "FAFSA is the form you fill out to qualify for federal grants, loans, and work-study programs." },
                { question: "When do you typically start repaying federal student loans?", options: ["Immediately", "6 months after graduation", "1 year after graduation", "Never"], correct: 1, explanation: "Federal loans have a 6-month grace period after you graduate, leave school, or drop below half-time enrollment." },
                { question: "What is loan forgiveness?", options: ["Free money for college", "Having part of your loan balance erased", "Lower interest rates", "Skipping payments"], correct: 1, explanation: "Loan forgiveness programs cancel part or all of your loan balance if you meet specific criteria (like working in public service)." },
                { question: "Which repayment plan is based on your income?", options: ["Standard Repayment", "Graduated Repayment", "Income-Driven Repayment", "Extended Repayment"], correct: 2, explanation: "Income-Driven Repayment (IDR) plans adjust your monthly payment based on your income and family size." },
                { question: "Can student loans be discharged in bankruptcy?", options: ["Yes, easily", "No, never", "Only in rare cases of undue hardship", "Only federal loans"], correct: 2, explanation: "Student loans are extremely difficult to discharge in bankruptcy. You must prove 'undue hardship' in court." },
                { question: "What happens if you default on federal student loans?", options: ["Nothing", "Wage garnishment, damaged credit, lost tax refunds", "Automatic forgiveness", "Lower interest rate"], correct: 1, explanation: "Defaulting triggers serious consequences including wage garnishment, credit damage, and interception of tax refunds." },
                { question: "What is the current federal student loan interest rate range (2024)?", options: ["1-3%", "5-8%", "10-15%", "15-20%"], correct: 1, explanation: "Federal student loan rates for 2024-2025 range from about 5.5% to 8% depending on the loan type." },
                { question: "Can you refinance federal student loans?", options: ["No, never", "Yes, but you lose federal protections", "Only with the government", "Only private loans can be refinanced"], correct: 1, explanation: "You can refinance federal loans with a private lender, but you lose access to federal benefits like income-driven repayment and forgiveness." },
                { question: "What is the Public Service Loan Forgiveness (PSLF) program?", options: ["Free tuition for everyone", "Loan forgiveness after 10 years of public service payments", "Lower rates for government employees", "Automatic forgiveness after graduation"], correct: 1, explanation: "PSLF forgives remaining federal loan balance after 120 qualifying monthly payments while working full-time for a qualifying employer (government or non-profit)." }
            ]
        };

        let currentQuestion = 0, score = 0, answers = [];

        function startQuiz() { currentQuestion = 0; score = 0; answers = []; showQuestion(); }

        function showQuestion() {
            const q = quizData.data[currentQuestion];
            const progress = ((currentQuestion + 1) / quizData.data.length) * 100;
            document.getElementById('quiz-content').innerHTML = `
                <div class="quiz-header"><span class="category-tag">${quizData.category}</span><h1>${quizData.title}</h1></div>
                <div class="progress-container"><div class="progress-bar-bg"><div class="progress-bar" style="width: ${progress}%"></div></div><div class="progress-text">Question ${currentQuestion + 1} of ${quizData.data.length}</div></div>
                <div class="question-container"><h2>${q.question}</h2><div class="options-list" id="options">${q.options.map((opt, i) => `<button class="option" onclick="selectAnswer(${i})" data-index="${i}">${opt}</button>`).join('')}</div></div>`;
        }

        function selectAnswer(index) {
            const q = quizData.data[currentQuestion];
            const isCorrect = index === q.correct;
            answers.push({ question: q.question, selected: index, correct: q.correct, isCorrect });
            if (isCorrect) score++;
            document.querySelectorAll('.option').forEach(btn => { btn.classList.add('disabled'); if (parseInt(btn.dataset.index) === q.correct) btn.classList.add('correct'); else if (parseInt(btn.dataset.index) === index && !isCorrect) btn.classList.add('incorrect'); });
            document.querySelector('.question-container').innerHTML += `<div class="explanation ${isCorrect ? 'correct' : 'incorrect'}"><h4>${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</h4><p>${q.explanation}</p><button class="next-btn" onclick="nextQuestion()">${currentQuestion < quizData.data.length - 1 ? 'Next →' : 'See Results'}</button></div>`;
        }

        function nextQuestion() { currentQuestion++; if (currentQuestion < quizData.data.length) showQuestion(); else showResults(); }

        function showResults() {
            const pct = Math.round((score / quizData.data.length) * 100);
            let msg = pct >= 90 ? 'Loan Expert!' : pct >= 70 ? 'Well Done!' : pct >= 50 ? 'Keep Learning!' : 'Study More!';
            let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '⭐' : pct >= 50 ? '📚' : '💪';
            document.getElementById('quiz-content').innerHTML = `<div class="results-container"><div class="results-emoji">${emoji}</div><h2>${msg}</h2><div class="results-score">${score}/${quizData.data.length}</div><div class="results-subtitle">${pct}%</div><div class="results-actions"><button class="btn btn-primary" onclick="startQuiz()">Retake</button><a href="/" class="btn btn-secondary">More Quizzes →</a></div></div>`;
        }
    </script>
</body>
</html>
