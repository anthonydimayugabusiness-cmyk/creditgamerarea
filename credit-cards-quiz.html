<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Cards 101 Quiz - Credit Gamer Area</title>
    <meta name="description" content="Learn how to use credit cards responsibly, avoid debt, and maximize rewards. 10 questions.">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .quiz-page { padding: 40px 0; min-height: calc(100vh - 200px); }
        .quiz-container { max-width: 700px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .quiz-header { text-align: center; margin-bottom: 32px; }
        .quiz-header .category-tag { display: inline-block; background: #6366f1; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 600; margin-bottom: 16px; }
        .quiz-header h1 { font-size: 1.875rem; margin-bottom: 8px; }
        .progress-container { margin-bottom: 32px; }
        .progress-bar-bg { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #6366f1, #8b5cf6); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
        .progress-text { font-size: 0.875rem; color: #64748b; margin-top: 8px; text-align: center; }
        .question-container h2 { font-size: 1.375rem; margin-bottom: 24px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option { background: white; border: 2px solid #e2e8f0; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; }
        .option:hover { border-color: #6366f1; background: #f8fafc; }
        .option.correct { border-color: #10b981; background: #d1fae5; }
        .option.incorrect { border-color: #ef4444; background: #fee2e2; }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .explanation { margin-top: 24px; padding: 20px; border-radius: 12px; }
        .explanation.correct { background: #d1fae5; border: 1px solid #10b981; }
        .explanation.incorrect { background: #fee2e2; border: 1px solid #ef4444; }
        .explanation h4 { margin-bottom: 8px; font-size: 1.125rem; }
        .explanation.correct h4 { color: #047857; }
        .explanation.incorrect h4 { color: #b91c1c; }
        .next-btn { margin-top: 16px; background: #6366f1; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .results-container { text-align: center; padding: 40px 20px; }
        .results-emoji { font-size: 4rem; margin-bottom: 16px; }
        .results-score { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 16px 0; }
        .results-message { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        .results-subtitle { color: #64748b; margin-bottom: 32px; }
        .results-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-secondary { background: white; color: #6366f1; border: 2px solid #6366f1; }
        .start-screen { text-align: center; padding: 40px 20px; }
        .quiz-meta { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
        .quiz-meta span { display: flex; align-items: center; gap: 8px; color: #64748b; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">💳 Credit Gamer Area</a>
        </div>
    </nav>

    <section class="quiz-page">
        <div class="container">
            <div id="quiz-content" class="quiz-container">
                <div class="start-screen">
                    <span class="category-tag">Credit</span>
                    <h2>💳 Credit Cards 101 Quiz</h2>
                    <p>Learn how to use cards responsibly, avoid debt, and maximize rewards</p>
                    <div class="quiz-meta">
                        <span>📝 10 Questions</span>
                        <span>⏱️ ~5 min</span>
                        <span>📊 Easy</span>
                    </div>
                    <button class="btn btn-primary" onclick="startQuiz()" style="font-size: 1.125rem; padding: 16px 32px;">Start Quiz</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const quizData = {
            title: "Credit Cards 101",
            category: "Credit",
            description: "Learn how to use cards responsibly, avoid debt, and maximize rewards",
            questions: 10,
            difficulty: "Easy",
            time: "5 min",
            data: [
                { question: "What is the most important rule for using credit cards?", options: ["Always carry a balance", "Pay in full every month", "Max out your limit", "Make minimum payments"], correct: 1, explanation: "Paying in full every month avoids interest charges and builds good credit history." },
                { question: "What is the typical APR range for credit cards?", options: ["5-10%", "15-25%", "30-40%", "50%+"], correct: 1, explanation: "Most credit cards have APRs between 15-25%. Some go higher for subprime borrowers." },
                { question: "What does 'grace period' mean?", options: ["Time to dispute charges", "Interest-free period to pay balance", "Time to cancel card", "Late payment forgiveness"], correct: 1, explanation: "The grace period (usually 21-25 days) is when you can pay your balance without owing interest." },
                { question: "Which is better for building credit?", options: ["Having multiple cards with small balances", "One card paid in full monthly", "Maxing out cards and paying minimum", "Opening and closing cards frequently"], correct: 1, explanation: "One card paid in full monthly shows responsible use without complexity." },
                { question: "What is a credit card 'statement balance'?", options: ["Your total credit limit", "What you owe at the end of billing cycle", "Your minimum payment", "Your available credit"], correct: 1, explanation: "The statement balance is what you owe when the billing cycle closes." },
                { question: "How much should you spend on a credit card with a $1,000 limit?", options: ["$900-1000", "$500-700", "$100-300", "As much as possible"], correct: 2, explanation: "Keep utilization under 30% ($300 on $1,000 limit) for best credit scores." },
                { question: "What happens if you only pay the minimum payment?", options: ["Nothing, that's fine", "You pay interest on the remaining balance", "Your credit score goes up", "You get rewards bonus"], correct: 1, explanation: "Paying minimum means you carry a balance and pay interest on the rest." },
                { question: "What is a 'secured' credit card?", options: ["A card with fraud protection", "A card requiring a deposit", "A card with high limits", "A card for businesses only"], correct: 1, explanation: "Secured cards require a security deposit, making them accessible for building credit." },
                { question: "How many credit cards should a beginner have?", options: ["0", "1-2", "5-10", "As many as possible"], correct: 1, explanation: "Start with 1-2 cards to build credit without overwhelming yourself." },
                { question: "What is a cash advance on a credit card?", options: ["Free money from ATM", "Withdrawing cash with high fees and interest", "Cashback rewards", "Balance transfer"], correct: 1, explanation: "Cash advances have high fees (3-5%) and immediate interest accrual. Avoid them." }
            ]
        };

        let currentQuestion = 0, score = 0, answers = [];

        function startQuiz() { currentQuestion = 0; score = 0; answers = []; showQuestion(); }

        function showQuestion() {
            const q = quizData.data[currentQuestion];
            const progress = ((currentQuestion + 1) / quizData.data.length) * 100;
            document.getElementById('quiz-content').innerHTML = `
                <div class="quiz-header"><span class="category-tag">${quizData.category}</span><h1>${quizData.title}</h1></div>
                <div class="progress-container"><div class="progress-bar-bg"><div class="progress-bar" style="width: ${progress}%"></div></div><div class="progress-text">Question ${currentQuestion + 1} of ${quizData.data.length}</div></div>
                <div class="question-container"><h2>${q.question}</h2><div class="options-list" id="options">${q.options.map((opt, i) => `<button class="option" onclick="selectAnswer(${i})" data-index="${i}">${opt}</button>`).join('')}</div></div>`;
        }

        function selectAnswer(index) {
            const q = quizData.data[currentQuestion];
            const isCorrect = index === q.correct;
            answers.push({ question: q.question, selected: index, correct: q.correct, isCorrect });
            if (isCorrect) score++;
            document.querySelectorAll('.option').forEach(btn => { btn.classList.add('disabled'); if (parseInt(btn.dataset.index) === q.correct) btn.classList.add('correct'); else if (parseInt(btn.dataset.index) === index && !isCorrect) btn.classList.add('incorrect'); });
            document.querySelector('.question-container').innerHTML += `<div class="explanation ${isCorrect ? 'correct' : 'incorrect'}"><h4>${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</h4><p>${q.explanation}</p><button class="next-btn" onclick="nextQuestion()">${currentQuestion < quizData.data.length - 1 ? 'Next →' : 'See Results'}</button></div>`;
        }

        function nextQuestion() { currentQuestion++; if (currentQuestion < quizData.data.length) showQuestion(); else showResults(); }

        function showResults() {
            const pct = Math.round((score / quizData.data.length) * 100);
            let msg = pct >= 90 ? 'Credit Card Pro!' : pct >= 70 ? 'Well Done!' : pct >= 50 ? 'Keep Learning!' : 'Study More!';
            let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '⭐' : pct >= 50 ? '📚' : '💪';
            document.getElementById('quiz-content').innerHTML = `<div class="results-container"><div class="results-emoji">${emoji}</div><h2>${msg}</h2><div class="results-score">${score}/${quizData.data.length}</div><div class="results-subtitle">${pct}%</div><div class="results-actions"><button class="btn btn-primary" onclick="startQuiz()">Retake</button><a href="/" class="btn btn-secondary">More Quizzes →</a></div></div>`;
        }
    </script>
</body>
</html>
