<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - AI Skills Quiz</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .quiz-page { padding: 60px 0; background: #f8fafc; min-height: 100vh; }
        .quiz-container { max-width: 700px; margin: 0 auto; padding: 0 20px; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 40px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #06b6d4); border-radius: 4px; width: 60%; }
        .question { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question-number { color: #8b5cf6; font-weight: 700; margin-bottom: 12px; }
        .question h2 { font-size: 1.5rem; margin-bottom: 32px; color: #1e1b4b; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 20px 24px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.2s; text-align: left; font-size: 1rem; }
        .option:hover { border-color: #8b5cf6; background: #faf5ff; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container"><a href="/" class="logo">💳 Credit Gamer Area</a></div></nav>
    <div class="quiz-page"><div class="quiz-container">
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="question">
            <div class="question-number">Question 9 of 15</div>
            <h2>Question 9 loading...</h2>
            <div class="options">
                <button class="option" onclick="next()">Option A</button>
                <button class="option" onclick="next()">Option B</button>
                <button class="option" onclick="next()">Option C</button>
                <button class="option" onclick="next()">Option D</button>
            </div>
        </div>
    </div></div>
    <script>
        function next() {
            window.location.href = '/quiz/ai-skills/q10.html';
        }
    </script>
</body>
</html>
