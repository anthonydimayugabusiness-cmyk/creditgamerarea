<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - AI Skills Quiz</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .quiz-page { padding: 60px 0; background: #f8fafc; min-height: 100vh; }
        .quiz-container { max-width: 700px; margin: 0 auto; padding: 0 20px; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 40px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #06b6d4); border-radius: 4px; width: 6.6%; }
        .question { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question-number { color: #8b5cf6; font-weight: 700; margin-bottom: 12px; }
        .question h2 { font-size: 1.5rem; margin-bottom: 32px; color: #1e1b4b; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 20px 24px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.2s; text-align: left; font-size: 1rem; }
        .option:hover { border-color: #8b5cf6; background: #faf5ff; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 32px; }
        .btn { padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6, #06b6d4); color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">💳 Credit Gamer Area</a>
        </div>
    </nav>

    <div class="quiz-page">
        <div class="quiz-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="question">
                <div class="question-number">Question 1 of 15</div>
                <h2>What's your primary goal with learning AI skills?</h2>

                <div class="options">
                    <button class="option" onclick="answer(0)">
                        💰 Make extra income on the side
                    </button>
                    
                    <button class="option" onclick="answer(1)">
                        ⏰ Save time and reduce stress in my daily life
                    </button>
                    
                    <button class="option" onclick="answer(2)">
                        🚀 Both - I want to make money AND save time
                    </button>
                    
                    <button class="option" onclick="answer(3)">
                        📚 Learn new skills for career advancement
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        sessionStorage.setItem('ai_score', '0');
        sessionStorage.setItem('ai_money', '0');
        sessionStorage.setItem('ai_time', '0');
        sessionStorage.setItem('ai_career', '0');
        
        function answer(selected) {
            let money = parseInt(sessionStorage.getItem('ai_money')) || 0;
            let time = parseInt(sessionStorage.getItem('ai_time')) || 0;
            let career = parseInt(sessionStorage.getItem('ai_career')) || 0;
            
            if (selected === 0) money += 2;
            if (selected === 1) time += 2;
            if (selected === 2) { money += 1; time += 1; }
            if (selected === 3) career += 2;
            
            sessionStorage.setItem('ai_money', money);
            sessionStorage.setItem('ai_time', time);
            sessionStorage.setItem('ai_career', career);
            
            window.location.href = '/quiz/ai-skills/q2.html';
        }
    </script>
</body>
</html>
