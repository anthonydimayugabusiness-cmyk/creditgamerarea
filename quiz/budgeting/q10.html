<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgeting - Question 10</title>
<link rel="stylesheet" href="/styles.css">
<style>
.quiz-container { max-width: 700px; margin: 40px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.category-tag { background: #8b5cf6; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 600; display: inline-block; margin-bottom: 16px; }
.question { font-size: 1.5rem; margin: 24px 0; }
.option { display: block; width: 100%; padding: 16px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 12px; background: white; cursor: pointer; font-size: 1rem; text-align: left; }
.option:hover { border-color: #8b5cf6; }
.option.correct { background: #d1fae5; border-color: #10b981; }
.option.wrong { background: #fee2e2; border-color: #ef4444; }
.explanation { display: none; margin-top: 24px; padding: 20px; border-radius: 12px; }
.explanation.show { display: block; }
.next-btn { display: inline-block; margin-top: 16px; padding: 14px 28px; background: #8b5cf6; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>

<nav class="navbar"><div class="container"><a href="/" class="logo">💳 Credit Gamer Area</a></div></nav>

<div class="quiz-container">
<span class="category-tag">Budgeting - Question 10 of 10</span>
<div class="question">How often should you review your budget?</div>

<button class="option" id="opt0" onclick="answer(0)">Once a year</button>
<button class="option" id="opt1" onclick="answer(1)">Monthly</button>
<button class="option" id="opt2" onclick="answer(2)">Only when in debt</button>
<button class="option" id="opt3" onclick="answer(3)">Never</button>

<div id="exp" class="explanation">
<strong id="res"></strong><br><br>YNAB, Mint, and PocketGuard are popular budgeting apps with different approaches.<br><br>
<a href="/quiz-complete.html" class="next-btn">See Results →</a>
</div>
</div>

<script>
var correct = 1;
var answered = false;
function answer(n) {
  if (answered) return;
  answered = true;
  document.getElementById('opt' + correct).classList.add('correct');
  if (n != correct) document.getElementById('opt' + n).classList.add('wrong');
  document.getElementById('exp').classList.add('show');
  document.getElementById('res').textContent = (n == correct) ? '✓ Correct!' : '✗ Incorrect';
}
</script>

</body>
</html>
