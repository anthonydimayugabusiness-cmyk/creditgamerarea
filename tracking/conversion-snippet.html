// Add this to quiz-complete.html to track conversions
// Place before closing </body> tag

<script src="/tracking/tracking.js"></script>
<script>
// Track quiz completion as conversion
document.addEventListener('DOMContentLoaded', function() {
  // Get quiz info from URL or session
  const urlParams = new URLSearchParams(window.location.search);
  const quizName = urlParams.get('quiz') || sessionStorage.getItem('last_quiz') || 'unknown';
  const score = parseInt(sessionStorage.getItem('last_score') || '0');
  
  // Track the conversion
  if (window.CGTracking) {
    window.CGTracking.trackConversion(quizName, score, 0)
      .then(result => {
        console.log('Conversion tracked:', result);
      });
  }
});
</script>
