    <link rel="stylesheet" href="/styles.css">
    <style>
        .quiz-page { padding: 40px 0; min-height: calc(100vh - 200px); }
        .quiz-container { max-width: 700px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .quiz-header { text-align: center; margin-bottom: 32px; }
        .quiz-header .category-tag { display: inline-block; background: #f59e0b; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 600; margin-bottom: 16px; }
        .quiz-header h1 { font-size: 1.875rem; margin-bottom: 8px; }
        .progress-container { margin-bottom: 32px; }
        .progress-bar-bg { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #f59e0b, #fbbf24); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
        .progress-text { font-size: 0.875rem; color: #64748b; margin-top: 8px; text-align: center; }
        .question-container h2 { font-size: 1.375rem; margin-bottom: 24px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option { background: white; border: 2px solid #e2e8f0; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; }
        .option:hover { border-color: #f59e0b; background: #f8fafc; }
        .option.correct { border-color: #10b981; background: #d1fae5; }
        .option.incorrect { border-color: #ef4444; background: #fee2e2; }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .explanation { margin-top: 24px; padding: 20px; border-radius: 12px; }
        .explanation.correct { background: #d1fae5; border: 1px solid #10b981; }
        .explanation.incorrect { background: #fee2e2; border: 1px solid #ef4444; }
        .explanation h4 { margin-bottom: 8px; font-size: 1.125rem; }
        .explanation.correct h4 { color: #047857; }
        .explanation.incorrect h4 { color: #b91c1c; }
        .next-btn { margin-top: 16px; background: #f59e0b; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .results-container { text-align: center; padding: 40px 20px; }
        .results-emoji { font-size: 4rem; margin-bottom: 16px; }
        .results-score { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 16px 0; }
        .results-message { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        .results-subtitle { color: #64748b; margin-bottom: 32px; }
        .results-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 14px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background: #f59e0b; color: white; }
        .btn-secondary { background: white; color: #f59e0b; border: 2px solid #f59e0b; }
        .start-screen { text-align: center; padding: 40px 20px; }
        .quiz-meta { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
        .quiz-meta span { display: flex; align-items: center; gap: 8px; color: #64748b; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">💳 Credit Gamer Area</a>
        </div>
    </nav>

    <section class="quiz-page">
        <div class="container">
            <div id="quiz-content" class="quiz-container">
                <div class="start-screen">
                    <span class="category-tag">Finance</span>
                    <h2>🎯 Budgeting Quiz</h2>
                    <p>50/30/20 rule, apps, and how to save while gaming</p>
                    <div class="quiz-meta">
                        <span>📝 10 Questions</span>
                        <span>⏱️ ~5 min</span>
                        <span>📊 Easy</span>
                    </div>
                    <button class="btn btn-primary" onclick="startQuiz()" style="font-size: 1.125rem; padding: 16px 32px;">Start Quiz</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const quizData = {
            title: "Budgeting",
            category: "Finance",
            description: "50/30/20 rule, apps, and how to save while gaming",
            questions: 10,
            difficulty: "Easy",
            time: "5 min",
            data: [
                { question: "What is the 50/30/20 rule?", options: ["50% needs, 30% wants, 20% savings", "50% savings, 30% needs, 20% wants", "50% rent, 30% food, 20% fun", "50% invest, 30% spend, 20% save"], correct: 0, explanation: "The 50/30/20 rule suggests spending 50% on needs, 30% on wants, and 20% on savings/debt repayment." },
                { question: "Which of these is a 'need'?", options: ["Netflix subscription", "Rent payment", "Video games", "Restaurant meals"], correct: 1, explanation: "Rent is a need — it's essential for housing. Netflix, games, and dining out are wants." },
                { question: "What is a zero-based budget?", options: ["Having zero money", "Giving every dollar a job until income minus expenses equals zero", "Spending nothing", "Only saving money"], correct: 1, explanation: "Zero-based budgeting means assigning every dollar to a category so your income minus expenses equals zero (every dollar is allocated)." },
                { question: "How much should you save for emergencies?", options: ["$100", "$500", "3-6 months of expenses", "1 year of salary"], correct: 2, explanation: "Financial experts recommend saving 3-6 months of living expenses in an emergency fund." },
                { question: "What is the envelope budgeting method?", options: ["Putting cash in envelopes for each spending category", "Mailing your budget to the bank", "Using only credit cards", "Automatic bill pay only"], correct: 0, explanation: "The envelope method involves putting cash in physical envelopes labeled for different spending categories. When the envelope is empty, you stop spending in that category." },
                { question: "Which app is popular for budgeting?", options: ["Instagram", "Mint or YNAB", "TikTok", "Netflix"], correct: 1, explanation: "Mint (free) and YNAB (You Need A Budget) are popular budgeting apps that help track spending and create budgets." },
                { question: "What is 'paying yourself first'?", options: ["Buying whatever you want", "Saving money before spending on anything else", "Paying bills last", "Only spending on yourself"], correct: 1, explanation: "Paying yourself first means automatically transferring money to savings as soon as you get paid, before spending on anything else." },
                { question: "What is lifestyle creep?", options: ["Bugs in your house", "Increasing spending as income increases", "Saving more money", "Moving to a cheaper place"], correct: 1, explanation: "Lifestyle creep is when you increase your spending as your income rises, instead of saving the extra money." },
                { question: "How can gamers save money?", options: ["Buy every new game", "Wait for sales, use Game Pass, buy used", "Only play free games", "Sell your console"], correct: 1, explanation: "Smart gaming savings: wait for Steam sales, use Xbox Game Pass or PS Plus, buy used games, and don't pre-order." },
                { question: "What should you do if you overspend one month?", options: ["Give up budgeting", "Adjust next month's budget, don't beat yourself up", "Ignore it", "Stop saving entirely"], correct: 1, explanation: "Budgeting is a skill. If you overspend, adjust next month's budget and keep going. Perfection isn't the goal — progress is." }
            ]
        };

        let currentQuestion = 0, score = 0, answers = [];

        function startQuiz() { currentQuestion = 0; score = 0; answers = []; showQuestion(); }

        function showQuestion() {
            const q = quizData.data[currentQuestion];
            const progress = ((currentQuestion + 1) / quizData.data.length) * 100;
            document.getElementById('quiz-content').innerHTML = `
                <div class="quiz-header"><span class="category-tag">${quizData.category}</span><h1>${quizData.title}</h1></div>
                <div class="progress-container"><div class="progress-bar-bg"><div class="progress-bar" style="width: ${progress}%"></div></div><div class="progress-text">Question ${currentQuestion + 1} of ${quizData.data.length}</div></div>
                <div class="question-container"><h2>${q.question}</h2><div class="options-list" id="options">${q.options.map((opt, i) => `<button class="option" onclick="selectAnswer(${i})" data-index="${i}">${opt}</button>`).join('')}</div></div>`;
        }

        function selectAnswer(index) {
            const q = quizData.data[currentQuestion];
            const isCorrect = index === q.correct;
            answers.push({ question: q.question, selected: index, correct: q.correct, isCorrect });
            if (isCorrect) score++;
            document.querySelectorAll('.option').forEach(btn => { btn.classList.add('disabled'); if (parseInt(btn.dataset.index) === q.correct) btn.classList.add('correct'); else if (parseInt(btn.dataset.index) === index && !isCorrect) btn.classList.add('incorrect'); });
            document.querySelector('.question-container').innerHTML += `<div class="explanation ${isCorrect ? 'correct' : 'incorrect'}"><h4>${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</h4><p>${q.explanation}</p><button class="next-btn" onclick="nextQuestion()">${currentQuestion < quizData.data.length - 1 ? 'Next →' : 'See Results'}</button></div>`;
        }

        function nextQuestion() { currentQuestion++; if (currentQuestion < quizData.data.length) showQuestion(); else showResults(); }

        function showResults() {
            const pct = Math.round((score / quizData.data.length) * 100);
            let msg = pct >= 90 ? 'Budget Master!' : pct >= 70 ? 'Well Done!' : pct >= 50 ? 'Keep Learning!' : 'Study More!';
            let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '⭐' : pct >= 50 ? '📚' : '💪';
            document.getElementById('quiz-content').innerHTML = `<div class="results-container"><div class="results-emoji">${emoji}</div><h2>${msg}</h2><div class="results-score">${score}/${quizData.data.length}</div><div class="results-subtitle">${pct}%</div><div class="results-actions"><button class="btn btn-primary" onclick="startQuiz()">Retake</button><a href="/" class="btn btn-secondary">More Quizzes →</a></div></div>`;
        }
    </script>
</body>
</html>
